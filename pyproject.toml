[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "retainnet"
version = "1.0.0"
description = "RetainNet: Deep Survival Analysis Framework for Dynamic CLTV & Churn Mitigation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23.0",
    "pandas>=1.5.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.9.0",
    "torch>=2.0.0",
    "lifelines>=0.27.0",
    "streamlit>=1.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
norecursedirs = ["RetainNet", ".*", "build", "dist", "__pycache__"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:scikit-survival is not installed.*:RuntimeWarning",
    "ignore:.*missing ScriptRunContext.*:UserWarning",
    "ignore:Could not find the number of physical cores.*:UserWarning",
]
